## Domain overlay: monitoring services only (Grafana + Prometheus stack).
## Use together with values-k8sda.yaml.

platformBootstrap:
  argocd:
    enabled: false

monitoring:
  kubePrometheusStack:
    enabled: true
  grafana:
    enabled: true

networking:
  enabled: false

storage:
  enabled: false

sysctlTuning:
  enabled: false

clusterBackup:
  enabled: false

backend:
  enabled: false
  eckOperator:
    enabled: false
  strimziOperator:
    enabled: false

logging:
  loki:
    enabled: false
  alloy:
    enabled: false

langfuse:
  enabled: false

aiPlatform:
  enabled: false
