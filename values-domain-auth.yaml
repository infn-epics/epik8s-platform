## Domain overlay: authentication (Keycloak) only.
## Use together with values-k8sda.yaml.

platformBootstrap:
  argocd:
    enabled: false

networking:
  enabled: false

storage:
  enabled: false

sysctlTuning:
  enabled: false

clusterBackup:
  enabled: false

monitoring:
  kubePrometheusStack:
    enabled: false
  grafana:
    enabled: false

backend:
  enabled: false
  eckOperator:
    enabled: false
  strimziOperator:
    enabled: false
  kibana:
    enabled: false

logging:
  loki:
    enabled: false
  alloy:
    enabled: false

langfuse:
  enabled: false

aiPlatform:
  enabled: false

auth:
  keycloak:
    enabled: true
