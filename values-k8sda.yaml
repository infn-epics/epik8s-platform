storage:
  enabled: true
  classes:
    - name: nfs20t
      provisioner: nfs.csi.k8s.io
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      mountOptions:
        - hard
        - nfsvers=4
        - rw
      parameters:
        server: nas01a-148.lnf.infn.it
        share: /export/nfs/k8sda00
    - name: archiver-lts
      provisioner: nfs.csi.k8s.io
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      mountOptions:
        - hard
        - nfsvers=4.1
        - rw
      parameters:
        server: 192.168.197.157
        share: /data_epik8s/archiver/lts
    - name: archiver-mts
      provisioner: nfs.csi.k8s.io
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      mountOptions:
        - hard
        - nfsvers=4.1
        - rw
      parameters:
        server: 192.168.197.157
        share: /data_epik8s/archiver/mts
    ## NOTE: cephfs-rwx's live source of truth today is the "cephfs-config" ArgoCD
    ## Application (repo k8sda.git, path charts/cephfs-config) - codified here for
    ## completeness/reproducibility, not as a competing GitOps owner. See README.
    - name: cephfs-rwx
      provisioner: cephfs.csi.ceph.com
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      mountOptions:
        - debug
      parameters:
        clusterID: da-cephfs
        fsName: test-da
        csi.storage.k8s.io/provisioner-secret-name: csi-cephfs-secret
        csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi-operator-system
        csi.storage.k8s.io/controller-expand-secret-name: csi-cephfs-secret
        csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi-operator-system
        csi.storage.k8s.io/node-stage-secret-name: csi-cephfs-secret
        csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi-operator-system

monitoring:
  kubePrometheusStack:
    enabled: true
  grafana:
    enabled: true

logging:
  loki:
    enabled: true
  alloy:
    enabled: true

clusterBackup:
  enabled: true
  namespace: backup
  createNamespace: false
  schedule: "1 0 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  retentionDays: 1
  image: bitnami/kubectl:latest
  centralServices:
    elasticsearch:
      enabled: true
      namespace: backend
      host: elasticsearch-es-http.backend.svc
      port: 9200
      username: elastic
      passwordSecretName: elasticsearch-es-elastic-user
      passwordSecretKey: elastic
      snapshotRepository: my_backup
    mongodb:
      enabled: true
      namespace: backend
      podName: mongodb-0
    grafana:
      enabled: true
      namespace: monitoring
      podSelector: app.kubernetes.io/name=grafana
      dataPath: /var/lib/grafana
  clusterRoles:
    - backup-cluster-role
  clusterRoleBindings:
    - backup-cluster-role-binding
  storage:
    create: false
    existingClaim: backup-storage
    accessMode: ReadWriteMany
    size: 500Gi
    storageClassName: nfs20t

## loki subchart values override - this cluster's CoreDNS Service is not named
## "kube-dns" (RKE2's default is "rke2-coredns-rke2-coredns"), but the loki
## chart's nginx gateway hardcodes an nginx resolver built from
## global.dnsService/global.dnsNamespace (defaults "kube-dns"/"kube-system") -
## without this override the gateway container crashloops on startup
## ("host not found in resolver"). Confirmed via `kubectl get svc -n
## kube-system | grep dns` on this cluster.
loki:
  global:
    dnsService: rke2-coredns-rke2-coredns
    dnsNamespace: kube-system

## alloy subchart values override - real in-cluster DNS name for the Loki
## single-binary Service, assuming this chart is deployed with release name
## "epik8s-platform" into a "logging" namespace (confirmed by rendering, see
## README.md "Centralized logging" for how to re-derive this if either changes).
## NOTE the double "alloy: alloy:" nesting - see the comment in values.yaml.
alloy:
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://epik8s-platform-loki.logging.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

## kube-prometheus-stack subchart values, reconciled against the live "prometheus"
## helm release. NOTE: `helm get values` initially reported nodeExporter.extraArgs /
## hostNetwork / service.port(9200) as "user-supplied", but kube-prometheus-stack's
## enable flags (kubeStateMetrics.*, nodeExporter.* at this level) are only used for
## the dependency `condition:` - the actual pass-through values for those two
## subcharts live under the hyphenated `kube-state-metrics:` / `prometheus-node-exporter:`
## keys instead, so those settings were silently inert. Verified against the live
## DaemonSet: it actually runs on hostNetwork with the chart's default port 9100,
## not 9200. Reproduced here as what's ACTUALLY running, not what was attempted -
## flagged in README as a pre-existing inconsistency, not something to silently "fix".
kube-prometheus-stack:
  ## pins the exact resource names from the live "prometheus" helm release (this
  ## chart is now a dependency of an umbrella release, so it no longer inherits
  ## that release name for free - see README).
  fullnameOverride: prometheus-kube-prometheus
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
    config:
      global:
        resolve_timeout: 5m
        smtp_smarthost: smtp.lnf.infn.it:25
        smtp_from: k8sda-alerts@lnf.infn.it
      route:
        receiver: platform-email
        group_by: [alertname, namespace, pod]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: "null"
        - name: platform-email
          email_configs:
            - to: andrea.michelotti@lnf.infn.it
              send_resolved: true
            - to: riccardo.gargana@lnf.infn.it
              send_resolved: true
  grafana:
    enabled: false ## grafana is deployed as its own separate release, see below
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true
  prometheus:
    prometheusSpec:
      hostNetwork: false
      serviceMonitorSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
    service:
      port: 9090
      targetPort: 9090
  ## grandchild dependencies (kube-state-metrics, prometheus-node-exporter) are
  ## nested INSIDE kube-prometheus-stack's own chart tree, so their pass-through
  ## values must be scoped here, not at this file's top level.
  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
  prometheus-node-exporter:
    fullnameOverride: prometheus-prometheus-node-exporter
  additionalPrometheusRulesMap:
    platform-alerts:
      groups:
        - name: platform.node.resource
          rules:
            - alert: NodeCPUHigh
              expr: |
                (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Node CPU usage is high"
                description: "CPU usage has been above 85% for 10 minutes."
            - alert: NodeMemoryHigh
              expr: |
                (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Node memory usage is high"
                description: "Memory usage has been above 90% for 10 minutes."
            - alert: NodeFilesystemHigh
              expr: |
                (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 > 85
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Node filesystem usage is high"
                description: "Filesystem usage has been above 85% for 15 minutes."
        - name: platform.workload.alerts
          rules:
            - alert: PodOOMKilled
              expr: |
                increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[5m]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod container OOMKilled"
                description: "A container was terminated because it ran out of memory."
            - alert: BackupFailures
              expr: |
                increase(kube_job_failed{namespace="backup",job_name=~"cluster-backup.*"}[24h]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Cluster backup job failures"
                description: "The cluster backup job has failed recently."

## grafana subchart values - exact USER-SUPPLIED VALUES from the live "grafana" helm
## release (grafana-10.3.0), EXCEPT adminUser/adminPassword: the live release set
## these as literal values, which this chart must not reproduce in git. The admin
## credentials already exist as the "grafana" Secret (keys admin-user/admin-password)
## created by that release - referencing it via admin.existingSecret is functionally
## identical (same Secret object, unchanged) without committing the plaintext.
## See README.md "Secrets handling".
grafana:
  ## pins the exact resource name from the live "grafana" helm release, see the
  ## kube-prometheus-stack.fullnameOverride note above.
  fullnameOverride: grafana
  admin:
    existingSecret: grafana
    userKey: admin-user
    passwordKey: admin-password
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: SPARC EPICS Archiver
          type: sasaki77-archiverappliance-datasource
          access: proxy
          url: http://archiver.sparc.svc.cluster.local:17665
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          ## same "epik8s-platform" release name / "logging" namespace assumption as
          ## the alloy: block above - see README.md "Centralized logging".
          url: http://epik8s-platform-loki.logging.svc.cluster.local:3100
  env:
    GF_SERVER_ROOT_URL: https://grafana.k8sda.lnf.infn.it
  grafana.ini:
    plugins:
      allow_loading_unsigned_plugins: sasaki77-archiverappliance-datasource
    server:
      root_url: https://grafana.k8sda.lnf.infn.it
  plugins:
    - sasaki77-archiverappliance-datasource
  extraInitContainers:
    - name: install-custom-plugins
      image: grafana/grafana:latest
      command:
        - /bin/sh
        - -c
      args:
        - /usr/share/grafana/bin/grafana-cli --pluginUrl https://github.com/sasaki77/archiverappliance-datasource/releases/latest/download/archiverappliance-datasource.zip
          plugins install sasaki77-archiverappliance-datasource;
      volumeMounts:
        - name: grafana-plugins
          mountPath: /var/lib/grafana/plugins
  extraVolumes:
    - name: grafana-plugins
      emptyDir: {}
  extraVolumeMounts:
    - name: grafana-plugins
      mountPath: /var/lib/grafana/plugins
  persistence:
    enabled: true
    ## live storage is a pre-existing, separately-managed PVC (ReadWriteMany on
    ## the nfs20t StorageClass codified above), not one the chart should create.
    existingClaim: grafana-nfs
    size: 20Gi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.k8sda.lnf.infn.it
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.k8sda.lnf.infn.it

## langfuse subchart values override - real UI hostname (nextauth.url must
## match this exactly for session/redirect correctness) and TLS, same
## nginx ingressClassName pattern as every other ingress in this file. The
## "langfuse-secrets" Secret this points at must be provisioned once, out
## of band - see README.md "Observability: Langfuse".
langfuse:
  langfuse:
    nextauth:
      url: https://langfuse.k8sda.lnf.infn.it
    ingress:
      enabled: true
      className: nginx
      ## without this, nginx has no valid cert for the host and silently
      ## falls back to its own default self-signed cert - Node's fetch()
      ## (LibreChat's own outbound calls to Langfuse) then hard-fails with
      ## "self-signed certificate" rather than a connection-refused/DNS
      ## error, which is what actually surfaced this live (see git history/
      ## session notes: LibreChat logged "[langfuse] feedback score failed:
      ## fetch failed", root-caused via a direct fetch() test from inside
      ## the LibreChat pod).
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: langfuse.k8sda.lnf.infn.it
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        secretName: langfuse-tls

aiPlatform:
  enabled: true
  namespace: ai-platform

  proxy:
    enabled: true
    httpProxy: http://squid.lnf.infn.it:3128
    httpsProxy: http://squid.lnf.infn.it:3128
    ## this is vllm's own NO_PROXY value specifically - other components set their
    ## own (narrower) noProxy field below, matching what's actually live.
    noProxy: "localhost,127.0.0.1,::1,10.0.0.0/8,192.168.0.0/16,.svc,.svc.cluster.local,.lnf.infn.it"

  ingress:
    className: nginx
    tlsSecretName: ai-platform-tls

  litellm:
    ingress:
      enabled: true
      host: litellm.k8sda.lnf.infn.it
    ## exact USER-SUPPLIED config from the live "litellm-config" ConfigMap.
    configYaml: |
      model_list:
        - model_name: gpt-4o-mini
          litellm_params:
            model: openai/llama3-8b
            api_base: http://vllm.ai-platform.svc.cluster.local:8000/v1
            api_key: none
        - model_name: llama3-8b
          litellm_params:
            model: openai/llama3-8b
            api_base: http://vllm.ai-platform.svc.cluster.local:8000/v1
            api_key: none
      general_settings:
        master_key: "change-me"
        completion_model: llama3-8b
        disable_spend_logs: true
        enforce_user_param: false
        # Optional soft rate-limit (requests/minute by key)
        max_requests_per_minute: 120
      router_settings:
        routing_strategy: simple-shuffle
        set_verbose: false

  qdrant:
    ## live PVC uses nfs20t (codified above under storage.classes), not local-path.
    storageClassName: nfs20t
    ingress:
      enabled: true
      host: qdrant.k8sda.lnf.infn.it

  ## NOTE: same "new capability, not codification" caveat as librechat below
  ## - nothing live to reproduce here yet. Requires GPU time-slicing enabled
  ## on the cluster first - see argusStt.image's comment in values.yaml.
  argusStt:
    ## live PVC storage class - see qdrant above.
    storageClassName: nfs20t
    ## Confirmed live 2026-07-29: the node's A2 GPU has 14GB free with only
    ## the "base" model loaded (838MB used of 15356MB total) - ample room
    ## for a much more accurate model. "base" was reported inaccurate for
    ## Italian speech in practice; large-v3 is faster-whisper's best
    ## general-purpose multilingual model. Revisit if transcription latency
    ## becomes noticeable in practice - "medium" is the fallback middle
    ## ground between base's speed and large-v3's accuracy.
    sttModel: "Systran/faster-whisper-large-v3"

  argusTts:
    storageClassName: nfs20t

  ## Confirmed live 2026-07-29: livekit-rtc's MetalLB-assigned external IP.
  ## Re-verify with `kubectl get svc livekit-rtc -n ai-platform` if this
  ## Service is ever deleted/recreated - MetalLB does not guarantee the
  ## same IP on redeploy unless a static IP is requested (see the
  ## loadbalancer: <ip> pattern used by pvagateway/gateway above).
  livekit:
    ## Was missing from this file despite livekit-server actually being
    ## live-deployed (values drift - confirmed 2026-08-05 the resource is
    ## a plain `kubectl apply`d object, not a tracked Helm release, so
    ## nothing caught this file no longer matching reality). Made explicit
    ## so a future `helm template ... -f values-k8sda.yaml` re-render
    ## doesn't silently omit livekit.yaml's resources entirely.
    enabled: true
    rtc:
      nodeIp: "192.168.108.224"
      ## Root-caused live 2026-08-05: templates/ai-platform/livekit.yaml's
      ## livekit-rtc Service only ever exposes ONE UDP port
      ## (rtc.portRangeStart, 50000 by default) - portRangeEnd is passed
      ## into livekit-server's own port_range_end config (telling it a
      ## WIDER range to allocate RTP media ports FROM) but is never
      ## reflected into the Service's port list. With the base values.yaml
      ## default (portRangeEnd: 50100), livekit-server can allocate a
      ## track's media to any of 101 ports while only port 50000 is
      ## actually reachable through the LoadBalancer - any track that
      ## lands elsewhere is silently unreachable (confirmed live: repeated
      ## "unsubscribing from track after notFoundTimeout / track cannot be
      ## found" on livekit-server, tracked back to every voice session
      ## since 2026-08-04T07:23 failing to deliver audio to STT). Pinning
      ## this to match portRangeStart forces every track onto the one port
      ## the Service actually exposes - the real behavior already, made
      ## explicit, at the cost of only ever supporting one concurrent RTC
      ## media session server-wide until the Service is widened instead
      ## (see values.yaml's rtc.portRangeEnd comment).
      portRangeEnd: 50000

  ## Confirmed live 2026-07-29: neither aiPlatform.litellm nor a vLLM
  ## backend is actually deployed on k8sda - LibreChat's own live config
  ## (argus-librechat-config ConfigMap) doesn't route through them either;
  ## its real default endpoint is this external AI-Gateway-90, model
  ## minimax-m27. Pointing the voice agent at the SAME default rather than
  ## standing up a redundant in-cluster LLM: reuses infra that's already
  ## proven working, and reuses the existing argus-librechat-credentials
  ## Secret's AIGW_90_API_KEY rather than provisioning a new one.
  voiceAgent:
    enabled: true
    llmBaseUrl: "https://ai-gateway.131.154.99.90.myip.cloud.infn.it/v1"
    llmModel: "minimax-m27"
    llmApiKeySecretName: "argus-librechat-credentials"
    llmApiKeySecretKey: "AIGW_90_API_KEY"
    ## External host, not in-cluster - needs the outbound proxy, same as
    ## LibreChat's own request to this same gateway (see its configenv's
    ## HTTPS_PROXY). Deliberately NOT the same mechanism as
    ## aiPlatform.proxy.enabled - see agent.py's LLM_HTTP_PROXY comment.
    llmHttpProxy: "http://squid.lnf.infn.it:3128"
    ## Confirmed live 2026-07-29: argus-tts's speaches server also serves
    ## Kokoro-82M (multilingual, includes a real Italian voice pair -
    ## if_sara female / im_nicola male), not just Piper. Switched to it as
    ## the default: noticeably higher quality than piper's it_IT-riccardo
    ## (x_low, the lowest Piper quality tier) and confirmed fast on this
    ## GPU (~0.3s for a short sentence). Piper's it_IT-paola-medium is a
    ## proven-working fallback if Kokoro's Italian quality disappoints in
    ## practice - swap ttsModel back to
    ## "speaches-ai/piper-it_IT-paola-medium" and ttsVoice to
    ## "it_IT-paola-medium".
    ttsModel: "speaches-ai/Kokoro-82M-v1.0-ONNX"
    ttsVoice: "if_sara"

  voiceToken:
    enabled: true

  mcp:
    ## Do not deploy the historical http-echo placeholders on k8sda.
    placeholders:
      epics-mcp:
        enabled: false
      git-mcp:
        enabled: false
    kubernetesMcp:
      enabled: true
      observer:
        ingress:
          enabled: true
          host: k8sda-mcp.k8sda.lnf.infn.it
    ragMcp:
      enabled: true
      baseUrl: "https://ragflow-api-lnf.131.154.99.90.myip.cloud.infn.it"
      apiKeySecretName: argus-librechat-credentials
      apiKeySecretKey: RAGFLOW_API_KEY
      ## Discover every dataset accessible to this service account. The list
      ## is cached briefly and refreshes automatically as datasets are added.
      datasetNameGlobs: "*"

  ## NOTE: unlike the rest of this file, there is no live centralized
  ## LibreChat to reproduce here - this is new capability, not codification.
  ## repoURL is a placeholder for the same reason as the top-level
  ## epik8s-platform-in-epik8s-da-infra blocker: argus-helm-chart has no git
  ## remote yet. Ingress host is reused from the old openwebui deployment
  ## since LibreChat is taking over as the chat UI.
  librechat:
    ## matches argusDefaults.charturl in epik8s-chart's own values.yaml - the
    ## same repo every beamline's argus service already points at.
    repoURL: https://github.com/infn-epics/argus-helm-chart.git
    ingress:
      enabled: true
      hosts:
        - host: argus.k8sda.lnf.infn.it
          paths:
            - path: /
              pathType: ImplementationSpecific
    ## AI-Gateway-WP6/90 are the same two INFN AI Gateway instances BTF's own
    ## argus already uses (epik8-btf... epik8s-btf/deploy/values.yaml
    ## epicsConfiguration.services.argus.llm.endpoints) - reused here as-is, not
    ## reinvented. Credentials for all three (including LiteLLM Gateway's own
    ## master key) live only in the argus-librechat-credentials Secret, never
    ## in this file - see README.md "Secrets handling".
    llmEndpoints:
      - name: "LiteLLM Gateway"
        apiKeySecretKey: "LITELLM_API_KEY"
        baseURL: "http://litellm.ai-platform.svc.cluster.local:4000/v1"
        models:
          default: ["llama3-8b"]
          fetch: true
        titleConvo: true
        modelDisplayLabel: "LiteLLM Gateway"
      - name: "AI-Gateway-WP6"
        apiKeySecretKey: "AIGW_WP6_API_KEY"
        baseURL: "https://ai-gateway.131.154.99.68.myip.cloud.infn.it/v1"
        models:
          default: ["qwen36-27b"]
          fetch: false
        modelDisplayLabel: "AI-Gateway-WP6"
      - name: "AI-Gateway-90"
        apiKeySecretKey: "AIGW_90_API_KEY"
        baseURL: "https://ai-gateway.131.154.99.90.myip.cloud.infn.it/v1"
        models:
          default: ["minimax-m27","qwen36-27b-x2","qwen36-27b", "gemma-4-31b-it", "qwen35-122b-a10b-gptq-int4"]
          fetch: true
        modelDisplayLabel: "AI-Gateway-90"
    ## New conversations open on AI-Gateway-90 / minimax-m27 by default.
    modelSpecs:
      enabled: true
      list:
        - name: "ai-gateway-90-minimax-m27"
          label: "AI-Gateway-90 - Minimax M2.7"
          default: true
          preset:
            endpoint: "AI-Gateway-90"
            model: "minimax-m27"
      ## Without this, a non-empty modelSpecs.list hides LibreChat's normal
      ## endpoint/model dropdown entirely - every llmEndpoints[].name above
      ## must be listed here too, or users can only ever get minimax-m27.
      addedEndpoints:
        - "LiteLLM Gateway"
        - "AI-Gateway-WP6"
        - "AI-Gateway-90"
    ## serviceName confirmed by rendering each beamline's computed argus values
    ## through argus-helm-chart directly (helm's naming convention for release
    ## name "argus" + chart name "argus-helm-chart", not simply "argus-mcp").
    argusMcpServers:
      ## sparc and euaps run argus-mcp only (librechat.enabled: false, see
      ## epik8-sparc/deploy/values.yaml and epik8s-euaps/deploy/values.yaml) -
      ## registered here instead of either running its own LibreChat.
      - name: sparc-argus
        namespace: sparc
        serviceName: argus-argus-helm-chart-argus-mcp
        roomName: sparc-argus-control-room
        title: "SPARC ARGUS"
        description: "ARGUS accelerator-control assistant for the SPARC beamline."
      - name: euaps-argus
        namespace: euaps
        serviceName: argus-argus-helm-chart-argus-mcp
        roomName: euaps-argus-control-room
        title: "EUAPS ARGUS"
        description: "ARGUS accelerator-control assistant for the EUAPS beamline."
      ## btf keeps running its OWN dedicated LibreChat too (2 BTF-specific
      ## AI-Gateway LLM endpoints) - epik8s-btf/deploy/values.yaml is
      ## untouched. This just makes the same already-running argus-mcp also
      ## reachable from the central LibreChat.
      - name: btf-argus
        namespace: btf
        serviceName: argus-argus-helm-chart-argus-mcp
        roomName: btf-argus-control-room
        title: "BTF ARGUS"
        description: "ARGUS accelerator-control assistant for the BTF beamline."

    ## same RAGFLOW instance BTF's own argus already uses
    ## (epik8s-btf/deploy/values.yaml epicsConfiguration.services.argus.argusMcp.backends.ragflow).
    argusMcp:
      enabled: true
      backends:
        ragflow:
          baseUrl: "https://ragflow-api-lnf.131.154.99.90.myip.cloud.infn.it"
        ## shared, cluster-wide instance - not beamline-specific, so this
        ## central argus-mcp (unlike each beamline's own) can genuinely
        ## search logs across every namespace at once. Same URL as every
        ## beamline's own instance - see README.md "Centralized logging".
        loki:
          baseUrl: "http://epik8s-platform-loki.logging.svc.cluster.local:3100"
        ## argocd.serverUrl intentionally left unset here - a real ArgoCD API
        ## token is needed (anonymous/readonly access is disabled on this
        ## cluster's ArgoCD, confirmed via argocd-cm), and none of the
        ## existing per-beamline accounts (btfuser/sparc/euaps) are scoped
        ## for cross-beamline visibility, which is the whole point of wiring
        ## this into the *central* instance specifically. Needs a real
        ## decision (new dedicated read-only account vs. reusing an existing
        ## one) before this can be set - see PR/session notes.

  confluenceIngester:
    baseUrl: https://confluence.infn.it
    spaces: LDCG
    sinceDays: "36500"

backend:
  enabled: true
  namespace: backend

  elasticsearch:
    ## live PVC has no explicit storageClassName -> uses the cluster default
    ## (local-path, already codified as default in storage.classes).
    storageSize: 50Gi

  mongo:
    ## live PVC uses archiver-lts (codified above under storage.classes).
    storageClassName: archiver-lts

  kafka:
    ## external LoadBalancer listener - IPs come from the default-k8s-108 MetalLB
    ## pool already codified under networking.metallb.pools.
    externalAccess:
      enabled: true
      bootstrapLoadBalancerIP: 192.168.108.251
      brokers:
        - broker: 0
          loadBalancerIP: 192.168.108.252
        - broker: 1
          loadBalancerIP: 192.168.108.253
        - broker: 2
          loadBalancerIP: 192.168.108.254
    ## NOTE: two node pools exist live for the same "eph-kafka" cluster - "dual"
    ## (ephemeral storage, no resource limits) looks like a leftover from an
    ## earlier migration, alongside "eph-kafka-pool" (persistent, resourced).
    ## Reproduced as-is rather than silently collapsed, see README.
    nodePools:
      - name: dual
        replicas: 3
        roles: [broker, controller]
        storage:
          type: jbod
          volumes:
            - id: 0
              type: ephemeral
              kraftMetadata: shared
      - name: eph-kafka-pool
        replicas: 3
        roles: [controller, broker]
        storage:
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
        resources:
          limits: { cpu: 2, memory: 4Gi }
          requests: { cpu: 1, memory: 2Gi }
