## The ai-platform domain as one Argo CD Application: everything
## `helm template ... -f values-k8sda.yaml -f values-domain-ai-platform.yaml`
## renders - the ai-platform workloads plus the child Applications
## (LibreChat, argus-mcp-instances) - reconciled from main instead of
## applied by hand. Same shape as the core and backend domain Applications
## (docs/runbooks/epik8s-platform-takeover.md). Applied once, by hand:
##
##   kubectl apply -f argocd/epik8s-platform-ai-platform.yaml
##
## Automated sync, self-healing, never pruning. It started out manual
## (2026-10-27), while git and the cluster disagreed: the domain rendered
## workloads that didn't run here and lacked voice-token's OIDC settings.
## Git was brought in line, synced once by hand, and the diff was empty.
## prune stays false: removing something from git never deletes it by
## itself - a person prunes, after reading `argocd app diff`.
##
## No resources-finalizer, deliberately: deleting this Application only
## removes the Application, and what it manages stays. Namespace, PVCs and
## child Applications additionally carry Delete=false,Prune=false
## (templates/_helpers.tpl), so even a cascading delete from the UI keeps
## them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epik8s-platform-ai-platform
  namespace: argocd
  labels:
    deploy: ai-platform
spec:
  project: default
  source:
    repoURL: https://github.com/infn-epics/epik8s-platform.git
    path: .
    targetRevision: main
    helm:
      ## The release name the domain has always been rendered with by hand,
      ## so names and labels don't change on the first sync.
      releaseName: epik8s-platform
      valueFiles:
        - values-k8sda.yaml
        - values-domain-ai-platform.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
