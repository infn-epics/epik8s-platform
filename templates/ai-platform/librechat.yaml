{{- /*
Centralized LibreChat, replacing the old per-component "openwebui" - see
README.md "Centralized LibreChat" for why this is an ArgoCD Application
(sourcing argus-helm-chart's own repo) rather than a raw manifest or a native
Helm dependency like the rest of this chart. This is the one place in
epik8s-platform that assumes ArgoCD at runtime.
*/ -}}
{{- if and .Values.aiPlatform.enabled .Values.aiPlatform.librechat.enabled }}
{{- $ns := .Values.aiPlatform.namespace }}
{{- $lc := .Values.aiPlatform.librechat }}
{{- /*
argus-helm-chart's own librechat-configmap.yaml expects each mcpServers.*
entry to still carry "enabled" (it does its own `if $server.enabled` +
`omit $server "enabled"`) - do NOT pre-strip it here, or every entry
silently disappears from the rendered librechat.yaml.
*/ -}}
{{- $mcpServers := deepCopy $lc.mcpServers }}
{{- /*
The kubernetes-observer and rag-mcp entries point at workloads owned by this chart.
Do not advertise either server to LibreChat when its workload is disabled: an
enabled registration with no matching Service makes LibreChat retry a dead DNS
name and eventually open its MCP circuit breaker. Externally managed entries
(for example loki-mcp) deliberately remain controlled only by mcpServers.*.
*/ -}}
{{- if not .Values.aiPlatform.mcp.kubernetesMcp.enabled }}
{{- $_ := unset $mcpServers "kubernetes-observer" }}
{{- end }}
{{- if not .Values.aiPlatform.mcp.ragMcp.enabled }}
{{- $_ := unset $mcpServers "rag-mcp" }}
{{- end }}
{{- /*
Deliberately NOT setting per-tool-call correlation headers here
(X-Librechat-Conversation-Id/Message-Id via LibreChat's {{LIBRECHAT_BODY_*}}
placeholders) -- tried this and it broke LibreChat's manual "Initialize"/
reconnect action for every argus-family server with "MCP error -32600:
Request body field(s) required to resolve runtime MCP placeholders:
conversationId, messageId", since that flow runs outside any chat message
and has no body to resolve those from. Live chat-based tool calls worked
fine, but breaking manual reinitialize wasn't an acceptable tradeoff.
Revisit only if LibreChat adds a way to make body-scoped placeholders
optional. Matches argus-helm-chart's own self-registered "argus" entry,
which has the same note.
*/ -}}
{{- /*
forwardUserToken (argusMcpServers[] and argusMcpInstances.instances[]): send
the signed-in user's own OpenID access token - their INFN AAI login - to
that ARGUS server on every tool call, which passes it on to Olog so logbook
reads and writes happen as that person (argus-mcp-server: X-Argus-User-Token).
Needs OPENID_REUSE_TOKENS=true in LibreChat's Secret; without it LibreChat
has no token to put in and ARGUS falls back to its configured Olog account.
A dedicated header, not Authorization: ARGUS passes it on, it doesn't check it.
Unlike the {{LIBRECHAT_BODY_*}} placeholders noted above, OpenID ones resolve
from the user's session, so they don't break the manual "Initialize" action.
*/ -}}
{{- /*
confirmWrites (default true; set false to opt out): X-Argus-Confirm-Writes,
so argus-mcp-server runs every write tool (set_pv, restart_ioc, logbook
entries...) in two steps - a preview and a one-time confirmation_id first,
the write only when called again with it. LibreChat has no approval step of
its own. The voice agent doesn't send it (it has its own operator gate).
Both headers come from epik8s-platform.argusHeaders (_helpers.tpl).
*/ -}}
{{- range $lc.argusMcpServers }}
{{- $entry := dict
      "enabled" true
      "type" "sse"
      "url" (printf "http://%s.%s.svc.cluster.local:%v%s" .serviceName .namespace (.port | default 8000) (.path | default "/sse"))
      "chatMenu" true
      "title" (.title | default .name)
      "description" (.description | default (printf "ARGUS accelerator-control assistant for %s." .name))
}}
{{- $headers := include "epik8s-platform.argusHeaders" . | fromJson }}
{{- if $headers }}
{{- $_ := set $entry "headers" $headers }}
{{- end }}
{{- $_ := set $mcpServers .name $entry }}
{{- end }}
{{- /*
argus-mcp servers this chart deploys itself (argus-mcp-instances.yaml):
same registration as argusMcpServers above, with the Service name that
template's fullnameOverride gives ("<name>-argus-mcp") and the title saying
which knowledge source the instance answers from, so the two halves of a
comparison are told apart in the chat menu.

LibreChat refuses to start at all ("Title can only contain letters,
numbers, and spaces") on any other character in a title, so every title is
reduced to those here, whatever values.yaml says.
*/ -}}
{{- range ($lc.argusMcpInstances | default dict).instances }}
{{- $source := .source | default "yaml" }}
{{- $sourceLabel := ternary "Knowledge Hub" "YAML" (eq $source "knowledgeHub") }}
{{- $port := ((.argusMcp | default dict).service | default dict).port | default 8000 }}
{{- $entry := dict
      "enabled" true
      "type" "sse"
      "url" (printf "http://%s-argus-mcp.%s.svc.cluster.local:%v/sse" .name $ns $port)
      "chatMenu" true
      "title" (regexReplaceAll "[^A-Za-z0-9 ]+" (.title | default (printf "%s %s" .name $sourceLabel)) " " | trim)
      "description" (.description | default (printf "ARGUS accelerator-control assistant, knowledge from %s." $sourceLabel))
}}
{{- $headers := include "epik8s-platform.argusHeaders" . | fromJson }}
{{- if $headers }}
{{- $_ := set $entry "headers" $headers }}
{{- end }}
{{- $_ := set $mcpServers .name $entry }}
{{- end }}
{{- /*
LibreChat's own outbound calls (e.g. to external AI-Gateway LLM endpoints) need
the corporate proxy, same as BTF's own argus release already sets via
librechat.librechat.configEnv - without it, requests to external baseURLs just
hang (no route without squid), not error out. See README.md.

DOMAIN_CLIENT/DOMAIN_SERVER aren't set by argus-helm-chart or the upstream
librechat subchart at all (neither references them - checked the vendored
chart) - LibreChat falls back to its own http://localhost:3080 default,
which is also what it uses to build the OIDC redirect_uri it sends to the
IdP. That mismatches $lc.publicUrl's real host and breaks auth.mode: oauth2
(IdP rejects a redirect_uri it doesn't recognize) even with a correct
client secret, so set both from publicUrl whenever it's non-empty.
*/ -}}
{{- $librechatSub := dict "enabled" true "ingress" $lc.ingress }}
{{- $configEnv := dict }}
{{- if $.Values.aiPlatform.proxy.enabled }}
{{- $_ := set $configEnv "HTTP_PROXY" $.Values.aiPlatform.proxy.httpProxy }}
{{- $_ := set $configEnv "HTTPS_PROXY" $.Values.aiPlatform.proxy.httpsProxy }}
{{- $_ := set $configEnv "NO_PROXY" $.Values.aiPlatform.proxy.noProxy }}
{{- end }}
{{- if $lc.mongoUri }}
{{- $_ := set $configEnv "MONGO_URI" $lc.mongoUri }}
{{- end }}
{{- if $lc.publicUrl }}
{{- $_ := set $configEnv "DOMAIN_CLIENT" $lc.publicUrl }}
{{- $_ := set $configEnv "DOMAIN_SERVER" $lc.publicUrl }}
{{- end }}
{{- /*
argus-helm-chart's librechat-secret.yaml never sets ALLOW_SOCIAL_REGISTRATION,
so LibreChat defaults it to off: with auth.mode: oauth2 that leaves no way to
create an account on first OIDC login. Only rendered when explicitly enabled.
*/ -}}
{{- if $lc.allowSocialRegistration }}
{{- $_ := set $configEnv "ALLOW_SOCIAL_REGISTRATION" "true" }}
{{- end }}
{{- if $configEnv }}
{{- $_ := set $librechatSub "librechat" (dict "configEnv" $configEnv) }}
{{- end }}
{{- /*
LibreChat's database is either the subchart's own MongoDB or, with mongoUri
set (MONGO_URI above), an external one - then the subchart's MongoDB isn't
deployed at all. Whichever subchart volumes do exist keep their data
whatever happens to the Applications above them (Delete=false,Prune=false,
_helpers.tpl), through each subchart's persistence.annotations; the
upstream chart's images claim takes no annotations, and storageClass's
Retain covers it.

One StorageClass for LibreChat's volumes, in the places the upstream chart
and its MongoDB/Meilisearch subcharts each look for it.
*/ -}}
{{- $keep := include "epik8s-platform.keepOnDelete" . | fromYaml }}
{{- $dbPersistence := dict "annotations" $keep }}
{{- if $lc.storageClass }}
{{- $_ := set $dbPersistence "storageClass" $lc.storageClass }}
{{- end }}
{{- if $lc.mongoUri }}
{{- $_ := set $librechatSub "mongodb" (dict "enabled" false) }}
{{- else }}
{{- $_ := set $librechatSub "mongodb" (dict "persistence" (deepCopy $dbPersistence)) }}
{{- end }}
{{- $_ := set $librechatSub "meilisearch" (dict "persistence" (deepCopy $dbPersistence)) }}
{{- if $lc.storageClass }}
{{- $inner := $librechatSub.librechat | default dict }}
{{- $_ := set $inner "imageVolume" (dict "storageClassName" $lc.storageClass) }}
{{- $_ := set $librechatSub "librechat" $inner }}
{{- end }}
{{- /*
Default: let argus-helm-chart generate+own its own credentials Secret. When
$lc.existingSecret is set (needed for auth.mode: oauth2 - see values.yaml's
comment on aiPlatform.librechat.existingSecret), tell it to skip that and
consume an already-existing Secret instead, populated out-of-band.
*/ -}}
{{- $secrets := dict "data" (dict) }}
{{- if $lc.existingSecret }}
{{- $_ := set $secrets "create" false }}
{{- $_ := set $secrets "existingSecret" $lc.existingSecret }}
{{- else }}
{{- $_ := set $secrets "create" true }}
{{- end }}
{{- $argusHelmValues := dict
      "librechat" $librechatSub
      "llm" (dict "endpoints" $lc.llmEndpoints)
      "mcpServers" $mcpServers
      "argusMcp" $lc.argusMcp
      "vllmService" (dict "enabled" false)
      "auth" $lc.auth
      "secrets" $secrets
}}
{{- if $lc.speech.enabled }}
{{- $_ := set $argusHelmValues "speech" $lc.speech }}
{{- end }}
{{- if $lc.modelSpecs.enabled }}
{{- $_ := set $argusHelmValues "modelSpecs" $lc.modelSpecs }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $lc.applicationName }}
  namespace: argocd
  labels:
    deploy: ai-platform
    app: librechat
  ## Owned by the ai-platform domain's Application (argocd/): deleting or
  ## pruning that one must not cascade into LibreChat and its data.
  annotations:
    {{- include "epik8s-platform.keepOnDelete" . | nindent 4 }}
spec:
  project: {{ $lc.project }}
  source:
    repoURL: {{ $lc.repoURL | quote }}
    path: .
    targetRevision: {{ $lc.targetRevision }}
    helm:
      values: |
{{ toYaml $argusHelmValues | indent 8 }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: {{ $ns }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Prune=true
{{- end }}
