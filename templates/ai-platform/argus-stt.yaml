{{- if and .Values.aiPlatform.enabled .Values.aiPlatform.argusStt.enabled }}
{{- $ns := .Values.aiPlatform.namespace }}
{{- $v := .Values.aiPlatform.argusStt }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-stt-model-cache
  namespace: {{ $ns }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $v.storageClassName }}
  storageClassName: {{ $v.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-stt
  namespace: {{ $ns }}
  labels:
    app: argus-stt
spec:
  # Single replica deliberately - a shared GPU STT service on a
  # nearly-saturated card (see values.yaml's vllm.gpuMemoryUtilization)
  # relies on one worker serializing requests rather than parallel batching.
  replicas: 1
  # Confirmed live 2026-07-29: default RollingUpdate briefly needs 2
  # nvidia.com/gpu on the same node (old pod + surge pod) - fine when the
  # node has spare GPUs, but plk8sdagpu001 only has 2 total and argus-tts
  # already claims one, so a routine restart deadlocked with "Insufficient
  # nvidia.com/gpu" until the old pod was deleted by hand. Recreate avoids
  # ever needing more than 1 GPU for this Deployment at a time, at the
  # cost of a brief STT outage during restarts - acceptable for a single-
  # replica GPU service.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argus-stt
  template:
    metadata:
      labels:
        app: argus-stt
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: argus-stt
          image: {{ $v.image }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WHISPER__MODEL
              value: {{ $v.sttModel | quote }}
            # Confirmed live 2026-07-29: speaches' default ttl=300 unloads
            # the model after 5 minutes idle to free GPU memory - fine for
            # the small "base" model (loads in ~1-2s), but large-v3 (used
            # here for better Italian accuracy, see values-k8sda.yaml)
            # takes ~27.5s to reload from scratch, which the debug latency
            # panel surfaced as a very real "STT è un po' alto" on any
            # turn after a >5min gap. -1 = never unload (WhisperConfig.ttl
            # docstring). This node's GPU has ample headroom - large-v3
            # resident uses ~4.3GB of 15.3GB total.
            - name: WHISPER__TTL
              value: "-1"
            {{- if $.Values.aiPlatform.proxy.enabled }}
            - name: HTTP_PROXY
              value: {{ $.Values.aiPlatform.proxy.httpProxy }}
            - name: http_proxy
              value: {{ $.Values.aiPlatform.proxy.httpProxy }}
            - name: HTTPS_PROXY
              value: {{ $.Values.aiPlatform.proxy.httpsProxy }}
            - name: https_proxy
              value: {{ $.Values.aiPlatform.proxy.httpsProxy }}
            - name: NO_PROXY
              value: {{ $.Values.aiPlatform.proxy.noProxy }}
            - name: no_proxy
              value: {{ $.Values.aiPlatform.proxy.noProxy }}
            {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface/hub
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: argus-stt-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: argus-stt
  namespace: {{ $ns }}
spec:
  type: ClusterIP
  selector:
    app: argus-stt
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
