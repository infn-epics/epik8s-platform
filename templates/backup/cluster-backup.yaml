{{- if .Values.clusterBackup.enabled }}
{{- $ns := .Values.clusterBackup.namespace | default "backup" }}
{{- $storageClassName := .Values.clusterBackup.storage.storageClassName | default "nfs20t" }}
{{- $claimName := .Values.clusterBackup.storage.existingClaim | default "backup-storage" }}
{{- if .Values.clusterBackup.createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: epik8s-platform
{{- end }}
{{- if .Values.clusterBackup.storage.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName }}
  namespace: {{ $ns }}
spec:
  accessModes:
    - {{ .Values.clusterBackup.storage.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ .Values.clusterBackup.storage.size | default "500Gi" }}
  storageClassName: {{ $storageClassName }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs:
      - get
      - list
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: backup-sa
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: backup-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-backup
  namespace: {{ $ns }}
spec:
  schedule: {{ .Values.clusterBackup.schedule | quote }}
  suspend: {{ .Values.clusterBackup.suspend | default false }}
  concurrencyPolicy: {{ .Values.clusterBackup.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.clusterBackup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.clusterBackup.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.clusterBackup.backoffLimit | default 2 }}
      activeDeadlineSeconds: {{ .Values.clusterBackup.activeDeadlineSeconds | default 14400 }}
      template:
        spec:
          serviceAccountName: backup-sa
          restartPolicy: Never
          containers:
            - name: backup-job
              image: {{ .Values.clusterBackup.image | default "bitnami/kubectl:latest" }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_ROOT="/backup/$TIMESTAMP"
                  MONTHLY_DIR="/backup/monthly"
                  FAILED=0

                  ## prune before backing up, so retention still applies on
                  ## nights where a later step fails under set -e
                  echo "Pruning daily backups older than {{ .Values.clusterBackup.retentionDays | default 7 }} days"
                  find /backup -mindepth 1 -maxdepth 1 -type d -name '20*_*' -mtime +{{ .Values.clusterBackup.retentionDays | default 7 }} -exec rm -rf {} \;
                  echo "Pruning monthly backups older than {{ .Values.clusterBackup.monthlyRetentionMonths | default 12 }} months"
                  if [ -d "$MONTHLY_DIR" ]; then
                    find "$MONTHLY_DIR" -mindepth 1 -maxdepth 1 -type d -mtime +{{ mul (.Values.clusterBackup.monthlyRetentionMonths | default 12) 31 }} -exec rm -rf {} \;
                  fi

                  CLUSTER_DIR="$BACKUP_ROOT/cluster"
                  SERVICES_DIR="$BACKUP_ROOT/central-services"
                  mkdir -p "$BACKUP_ROOT"
                  mkdir -p "$CLUSTER_DIR"
                  mkdir -p "$SERVICES_DIR"

                  echo "Starting cluster-scoped platform backup at $TIMESTAMP"

                  echo "Backing up storage classes managed by epik8s-platform"
                  {{- range $sc := .Values.storage.classes }}
                  kubectl get storageclass {{$sc.name}} -o yaml > "$CLUSTER_DIR/storageclass-{{$sc.name}}.yaml"
                  {{- end }}

                  echo "Backing up cluster roles and bindings managed by epik8s-platform"
                  {{- range $name := .Values.clusterBackup.clusterRoles }}
                  kubectl get clusterrole {{$name}} -o yaml > "$CLUSTER_DIR/clusterrole-{{$name}}.yaml"
                  {{- end }}
                  {{- range $name := .Values.clusterBackup.clusterRoleBindings }}
                  kubectl get clusterrolebinding {{$name}} -o yaml > "$CLUSTER_DIR/clusterrolebinding-{{$name}}.yaml"
                  {{- end }}

                  echo "Backing up cluster namespace objects (metadata only)"
                  kubectl get namespace -o yaml > "$CLUSTER_DIR/namespaces.yaml"

                  echo "Capturing platform desired node label state from values"
                  cat > "$CLUSTER_DIR/node-labels-from-values.json" <<'EOF'
{{ toJson .Values.networking.nodeLabels | nindent 18 }}
                  EOF

                  {{- $es := .Values.clusterBackup.centralServices.elasticsearch }}
                  {{- if $es.enabled }}
                  echo "Backing up central Elasticsearch"
                  ## runs in a subshell so an Elasticsearch failure still lets
                  ## MongoDB/Grafana back up; it fails the job at the end.
                  ## set -e is inert here (subshell is the left side of ||),
                  ## hence the explicit "|| exit 1" on every step.
                  (
                    ES_URL="https://{{ $es.host | default "elasticsearch-es-http.backend.svc" }}:{{ $es.port | default 9200 }}"
                    ES_REPO="{{ $es.snapshotRepository | default "my_backup" }}"
                    ES_CA=$(mktemp)
                    kubectl get secret {{ $es.caSecretName | default "elasticsearch-es-http-certs-public" }} -n {{ $es.namespace | default "backend" }} -o jsonpath='{.data.ca\.crt}' | base64 -d > "$ES_CA" || exit 1
                    ES_PASSWORD=$(kubectl get secret {{ $es.passwordSecretName | default "elasticsearch-es-elastic-user" }} -n {{ $es.namespace | default "backend" }} -o jsonpath='{.data.{{ $es.passwordSecretKey | default "elastic" }}}' | base64 -d) || exit 1
                    es() { curl -sS --fail-with-body --cacert "$ES_CA" -u "{{ $es.username | default "elastic" }}:$ES_PASSWORD" -H 'Content-Type: application/json' "$@"; }

                    ## idempotent: (re)registers the fs repository backed by
                    ## the es-snapshots volume mounted on every ES node
                    es -XPUT "$ES_URL/_snapshot/$ES_REPO" -d '{"type":"fs","settings":{"location":"{{ $es.repositoryLocation | default "/usr/share/elasticsearch/snapshots" }}"}}' || exit 1
                    echo

                    ## snapshots are incremental, so one all-indices snapshot
                    ## per night (system indices excluded) is cheap
                    snap() {
                      echo "  - snapshot $1"
                      es -XPUT "$ES_URL/_snapshot/$ES_REPO/$1?wait_for_completion=true" \
                        -d '{"indices":"*,-.*","include_global_state":false}' > /tmp/snap.json || { cat /tmp/snap.json; return 1; }
                      grep -q '"state":"SUCCESS"' /tmp/snap.json || { cat /tmp/snap.json; return 1; }
                    }
                    snap "nightly-$TIMESTAMP" || exit 1
                    MONTH=$(date +%Y%m)
                    if ! es "$ES_URL/_snapshot/$ES_REPO/monthly-$MONTH" > /dev/null 2>&1; then
                      snap "monthly-$MONTH" || exit 1
                    fi

                    DAILY_CUTOFF=$(date -d "-{{ .Values.clusterBackup.retentionDays | default 7 }} days" +%Y%m%d)
                    MONTHLY_CUTOFF=$(date -d "-{{ .Values.clusterBackup.monthlyRetentionMonths | default 12 }} months" +%Y%m)
                    for id in $(es "$ES_URL/_cat/snapshots/$ES_REPO?h=id") ; do
                      case "$id" in
                        nightly-*) [ "${id:8:8}" \< "$DAILY_CUTOFF" ] || continue ;;
                        monthly-*) [ "${id:8:6}" \< "$MONTHLY_CUTOFF" ] || continue ;;
                        *) continue ;;
                      esac
                      echo "  - pruning snapshot $id"
                      es -XDELETE "$ES_URL/_snapshot/$ES_REPO/$id" > /dev/null || exit 1
                    done
                  ) || { echo "Elasticsearch backup FAILED"; FAILED=1; }
                  {{- end }}

                  {{- if .Values.clusterBackup.centralServices.mongodb.enabled }}
                  echo "Backing up central MongoDB"
                  kubectl exec -n {{ .Values.clusterBackup.centralServices.mongodb.namespace | default "backend" }} {{ .Values.clusterBackup.centralServices.mongodb.podName | default "mongodb-0" }} -- mongodump --archive > "$SERVICES_DIR/mongodb_$TIMESTAMP.archive"
                  {{- end }}

                  {{- if .Values.clusterBackup.centralServices.grafana.enabled }}
                  echo "Backing up central Grafana data directory"
                  GRAFANA_POD=$(kubectl get pods -n {{ .Values.clusterBackup.centralServices.grafana.namespace | default "monitoring" }} -l '{{ .Values.clusterBackup.centralServices.grafana.podSelector | default "app.kubernetes.io/name=grafana" }}' -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  if [ -z "$GRAFANA_POD" ]; then
                    echo "  - no Grafana pod found"
                    exit 1
                  else
                    kubectl exec -n {{ .Values.clusterBackup.centralServices.grafana.namespace | default "monitoring" }} "$GRAFANA_POD" -- tar czf - -C {{ .Values.clusterBackup.centralServices.grafana.dataPath | default "/var/lib/grafana" }} . > "$SERVICES_DIR/grafana-data_$TIMESTAMP.tar.gz"
                  fi
                  {{- end }}

                  ## the first complete backup of each month is kept as that
                  ## month's monthly copy (not tied to the 1st, so one failed
                  ## night doesn't skip a month)
                  MONTH=$(date +%Y%m)
                  if [ "$FAILED" = 0 ] && [ ! -d "$MONTHLY_DIR/$MONTH" ]; then
                    echo "Promoting $TIMESTAMP to monthly backup $MONTH"
                    mkdir -p "$MONTHLY_DIR"
                    cp -a "$BACKUP_ROOT" "$MONTHLY_DIR/$MONTH"
                  fi

                  echo "Cluster-scoped backup completed: $BACKUP_ROOT"
                  exit "$FAILED"
              resources:
{{- toYaml .Values.clusterBackup.resources | nindent 16 }}
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ $claimName }}
{{- end }}
